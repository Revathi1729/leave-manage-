<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Leave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Leave Management System</h1>
    <p>Edit Leave Application</p>
</header>

<main class="container">
    <h2>Update Leave Details</h2>

    <form id="editForm">
        <label>Leave Type:</label>
        <input type="text" id="leave_type" required>

        <label>Start Date:</label>
        <input type="date" id="start_date" required>

        <label>End Date:</label>
        <input type="date" id="end_date" required>

        <label>Number of Days:</label>
        <input type="number" id="number_of_days" required>

        <label>Description:</label>
        <textarea id="description" required></textarea>

        <button type="submit" class="btn">Update Leave</button>
    </form>
</main>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("/leaves")
    .then(response => response.json())
    .then(leaves => {
        const leave = leaves.find(item => String(item.leave_id) === id);

        if (!leave) {
            alert("Leave record not found");
            return;
        }

        document.getElementById("leave_type").value = leave["leave type"];
        document.getElementById("start_date").value =
            new Date(leave["start date"]).toISOString().split("T")[0];
        document.getElementById("end_date").value =
            new Date(leave["end date"]).toISOString().split("T")[0];
        document.getElementById("number_of_days").value =
            leave["number of days"];
        document.getElementById("description").value = leave.description;
    });

document.getElementById("editForm").addEventListener("submit", function(e) {
    e.preventDefault();

    fetch(`/leaves/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            leave_type: document.getElementById("leave_type").value,
            start_date: document.getElementById("start_date").value,
            end_date: document.getElementById("end_date").value,
            number_of_days: document.getElementById("number_of_days").value,
            description: document.getElementById("description").value
        })
    })
    .then(response => {
        if (!response.ok) throw new Error("Update failed");
        alert("Leave updated successfully!");
        window.location.href = "manager.html";
    })
    .catch(error => alert(error.message));
});
</script>

</body>
</html>
