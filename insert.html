
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Leave Management System</h1>
        <p>Submit Your Leave Request</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="insert.html">Apply Leave</a>
        <a href="list.html">List Leaves</a>
        <a href="approved.html">Approved Leaves</a>
        <a href="rejected.html">Rejected Leaves</a>
    </nav>

    <main class="container">
        <h2>Employee Leave Application</h2>
        <p>Enter your details below to submit a leave request.</p>

        <form id="insertForm">

            <label for="employee_id">Employee ID</label>
            <select id="employee_id" name="employee_id" required>
                <option value="">Select Employee ID</option>
            </select>

            <label for="name">Employee Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Employee name" readonly required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Employee email" readonly required>

            <label for="leave_type">Leave Type</label>
            <select id="leave_type" name="leave_type" required>
                <option value="">Select leave type</option>
                <option value="Casual Leave">Casual Leave</option>
                <option value="Sick Leave">Sick Leave</option>
                <option value="Earned Leave">Earned Leave</option>
                <option value="Personal Leave">Personal Leave</option>
                <option value="Other">Other</option>
            </select>

            <label for="start_date">Start Date</label>
            <input type="date" id="start_date" name="start_date" required>

            <label for="end_date">End Date</label>
            <input type="date" id="end_date" name="end_date" required>

            <label for="number_of_days">Number of Days</label>
            <input type="number" id="number_of_days"
                   name="number_of_days" readonly required>

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      placeholder="Explain the reason for leave"
                      rows="4" required></textarea>

            <button type="submit" class="btn">
                Submit Application
            </button>

            <a href="index.html" class="cancel-btn">Cancel</a>

        </form>
    </main>

    <footer>
        <p>Leave Management System &copy; 2026</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
